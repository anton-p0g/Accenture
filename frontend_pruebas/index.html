
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Synthetic Spain AI - Chat</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
            padding: 30px;
            color: #222;
        }

        .contenedor {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .chat {
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fc;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .mensaje {
            padding: 13px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .usuario {
            background: #dfeaff;
            margin-left: 20%;
        }

        .asistente {
            background: #e8f5ed;
            margin-right: 15%;
        }

        .error {
            background: #ffe5e5;
            color: #9b1c1c;
        }

        .formulario {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            resize: vertical;
            min-height: 55px;
        }

        button {
            padding: 12px 22px;
            background: #2159c5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #17449b;
        }

        button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .estado {
            color: #777;
            font-size: 13px;
            margin-top: 10px;
        }

        .fiabilidad {
            display: block;
            margin-top: 8px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <h1>🇪🇸 Synthetic Spain AI</h1>

        <p class="subtitulo">
            Explora escenarios sintéticos de la sociedad española
        </p>

        <div class="chat" id="chat" aria-live="polite">
            <div class="mensaje asistente">
                ¡Hola! Pregúntame sobre los escenarios de
                España para 2026 o 2027.
            </div>
        </div>

        <form class="formulario" id="formulario">

            <textarea
                id="pregunta"
                placeholder="Escribe aquí tu pregunta..."
                minlength="8"
                maxlength="900"
                required
            ></textarea>

            <button type="submit" id="enviar">
                Enviar
            </button>

        </form>

        <p class="estado" id="estado">
            Conectado al backend local mediante FastAPI.
        </p>

    </main>

    <script>
        const formulario = document.getElementById("formulario");
        const preguntaInput = document.getElementById("pregunta");
        const chatContenedor = document.getElementById("chat");
        const botonEnviar = document.getElementById("enviar");
        const estado = document.getElementById("estado");

        // Utilizo una ruta relativa porque FastAPI servirá
        // tanto esta página como nuestro endpoint.
        const API_URL = "/escenarios/chat";

        // Creo mensajes sin interpretar HTML del usuario
        // ni del LLM, evitando inyectar código en la página.
        function agregarMensaje(texto, tipo, fiabilidad = null) {

            const mensaje = document.createElement("div");
            mensaje.className = "mensaje " + tipo;
            mensaje.textContent = texto;

            if (fiabilidad) {
                const detalle = document.createElement("small");
                detalle.className = "fiabilidad";
                detalle.textContent = "Fiabilidad: " + fiabilidad;
                mensaje.appendChild(detalle);
            }

            chatContenedor.appendChild(mensaje);

            chatContenedor.scrollTop =
                chatContenedor.scrollHeight;

            return mensaje;
        }

        // Envío la pregunta cuando pulso el botón.
        formulario.addEventListener("submit", async function(evento) {

            evento.preventDefault();

            const pregunta = preguntaInput.value.trim();

            if (pregunta.length < 8) {
                estado.textContent =
                    "Escribe una pregunta de al menos 8 caracteres.";
                return;
            }

            agregarMensaje(pregunta, "usuario");

            preguntaInput.value = "";
            botonEnviar.disabled = true;
            estado.textContent = "Consultando Qwen3 y DuckDB...";

            try {
                const respuestaHTTP = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        pregunta: pregunta
                    })
                });

                const datos = await respuestaHTTP.json();

                if (!respuestaHTTP.ok) {
                    throw new Error(
                        datos.detail || "Error en el servidor"
                    );
                }

                agregarMensaje(
                    datos.respuesta || "No se ha recibido respuesta.",
                    "asistente",
                    datos.fiabilidad || null
                );

                estado.textContent = "Consulta completada.";

            } catch (error) {

                agregarMensaje(
                    "No he podido obtener la respuesta: " +
                    error.message,
                    "error"
                );

                estado.textContent =
                    "Comprueba que FastAPI y Ollama funcionan.";

            } finally {

                botonEnviar.disabled = false;
                preguntaInput.focus();
            }
        });

        // Permito enviar con Enter.
        // Shift + Enter añade una nueva línea.
        preguntaInput.addEventListener("keydown", function(evento) {
            if (evento.key === "Enter" && !evento.shiftKey) {
                evento.preventDefault();

                if (!botonEnviar.disabled) {
                    formulario.requestSubmit();
                }
            }
        });
    </script>

</body>
</html>
